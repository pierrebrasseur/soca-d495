project:
  type: website
  output-dir: docs
  resources:
    - .nojekyll

lang: fr

website:
  title: "Théories du travail social"
  description: "Cours SOCA-D495 — Master en sciences du travail, Université libre de Bruxelles."
  site-url: "https://pierrebrasseur.github.io/soca-d495"
  repo-url: "https://github.com/pierrebrasseur/soca-d495"
  favicon: favicon.svg
  search:
    location: navbar
    type: overlay
  page-navigation: true
  back-to-top-navigation: false
  bread-crumbs: false

  navbar:
    title: "SOCA-D495"
    left:
      - href: index.qmd
        text: "Le cours"
      - href: evaluation.qmd
        text: "Évaluation"
      - href: references.qmd
        text: "Bibliographie"
    right:
      - text: "Fiche ULB"
        href: "https://www.ulb.be/fr/programme/soca-d495-1"
      - text: "Pierre Brasseur"
        href: "https://pierrebrasseur.github.io/cours-soca-d495.html"

  sidebar:
    style: floating
    collapse-level: 2
    contents:
      - href: index.qmd
        text: "Accueil"
      - section: "Bloc 1 · Le paradoxe constitutif"
        contents:
          - href: seance-1.qmd
            text: "1 · Paradigmes contemporains"
          - href: seance-2.qmd
            text: "2 · Émergence historique"
      - section: "Bloc 2 · Mutations et contrôle social"
        contents:
          - href: seance-3.qmd
            text: "3 · Professionnalisation"
          - href: seance-4.qmd
            text: "4 · Contrôle social"
          - href: seance-5.qmd
            text: "5 · Désaffiliation"
      - section: "Bloc 3 · Enjeux contemporains"
        contents:
          - href: seance-6.qmd
            text: "6 · Genre et intersectionnalité"
          - href: seance-7.qmd
            text: "7 · Managérialisation"
      - section: "Modules thématiques"
        contents:
          - href: module-c5.qmd
            text: "C5 · Pauvreté et accueil"
          - href: module-c7.qmd
            text: "C7 · Féminisme d'État"
          - href: module-c8.qmd
            text: "C8 · Planning familial"
      - section: "Repères"
        contents:
          - href: evaluation.qmd
            text: "Évaluation"
          - href: references.qmd
            text: "Bibliographie générale"

  page-footer:
    left: "[Pierre Brasseur](https://pierrebrasseur.github.io/) · METICES / STRIGES · Université libre de Bruxelles"
    center: "[Tous les enseignements](https://pierrebrasseur.github.io/enseignement.html)"
    right: "SOCA-D495 · 2025–2026"

format:
  html:
    theme:
      light: [theme/light.scss, theme/rules.scss]
      dark: [theme/dark.scss, theme/rules.scss]
    respect-user-color-scheme: true
    include-in-header: theme/fonts.html
    template-partials:
      - theme/title-block.html
    toc: true
    toc-depth: 2
    toc-title: "Dans cette séance"
    number-sections: false
    link-external-icon: false
    link-external-newwindow: true
    smooth-scroll: true
    grid:
      sidebar-width: 270px
      body-width: 720px
      margin-width: 230px
      gutter-width: 2.5rem
